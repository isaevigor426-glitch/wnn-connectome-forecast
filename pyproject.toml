[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnn"
version = "1.0.0"
description = "Alpha Connectome (Wunder Fund): recurrent ensembles for order-book forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pyarrow>=15.0"]

[project.optional-dependencies]
train = ["torch>=2.5", "onnx>=1.16", "onnxruntime>=1.18", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.12"]
engine = ["numba==0.67.0"]          # the version in the scorer image
dev = ["pytest>=8.0", "ruff>=0.6"]
figures = ["matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]               # the engine's slower tests: pytest -q engine/tests

[tool.ruff]
line-length = 120
